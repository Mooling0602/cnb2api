version: "3.8"

services:
  cnb2api:
    build:
      context: .
      dockerfile: Dockerfile.cnb2api
    container_name: cnb2api-gateway
    ports:
      - "7863:7863"
    volumes:
      - ./config.example.json:/app/config.json:ro
    networks:
      - cnb2api-net
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "-", "http://localhost:7863/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cnb2api-net:
    driver: bridge
